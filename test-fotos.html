<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Fotos</title>
    <style>
        body { 
            background: #0d0d0d; 
            color: white; 
            font-family: Arial, sans-serif; 
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .api-card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }
        .api-card h2 {
            color: #4a90d0;
            margin-top: 0;
        }
        .fotos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .fotos-grid img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .loading {
            color: #888;
            text-align: center;
            padding: 20px;
        }
        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        .input-group button {
            padding: 12px 24px;
            background: #4a90d0;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:hover {
            background: #5aa0e0;
        }
    </style>
</head>
<body>
    <h1>🔍 Prueba de APIs de Fotos</h1>
    
    <div class="input-group">
        <input type="text" id="searchInput" placeholder="Ej: Sagrada Familia Barcelona" value="Sagrada Familia Barcelona">
        <button onclick="probarTodas()">🔍 Probar todas</button>
    </div>

    <div class="container">
        <!-- Unsplash -->
        <div class="api-card">
            <h2>📸 Unsplash</h2>
            <div id="unsplash-result" class="loading">Cargando...</div>
        </div>

        <!-- Pexels -->
        <div class="api-card">
            <h2>📸 Pexels</h2>
            <div id="pexels-result" class="loading">Cargando...</div>
        </div>

        <!-- Wikipedia -->
        <div class="api-card">
            <h2>📸 Wikipedia</h2>
            <div id="wikipedia-result" class="loading">Cargando...</div>
        </div>
    </div>

    <div style="margin-top: 40px; padding: 20px; background: #1a1a2e; border-radius: 10px;">
        <h3>📊 Resultado de la prueba</h3>
        <div id="resultado-final" style="color: #aaa;"></div>
    </div>

    <script>
        async function probarTodas() {
            const query = document.getElementById('searchInput').value;
            
            // Limpiar resultados anteriores
            document.getElementById('unsplash-result').innerHTML = '<div class="loading">⏳ Buscando en Unsplash...</div>';
            document.getElementById('pexels-result').innerHTML = '<div class="loading">⏳ Buscando en Pexels...</div>';
            document.getElementById('wikipedia-result').innerHTML = '<div class="loading">⏳ Buscando en Wikipedia...</div>';
            document.getElementById('resultado-final').innerHTML = '';

            // Probar Unsplash
            try {
                const response = await fetch(`/api/unsplash?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                const fotos = data.fotos || [];
                renderFotos('unsplash-result', fotos, 'Unsplash');
            } catch (error) {
                document.getElementById('unsplash-result').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }

            // Probar Pexels
            try {
                const response = await fetch(`/api/pexels?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                const fotos = data.fotos || [];
                renderFotos('pexels-result', fotos, 'Pexels');
            } catch (error) {
                document.getElementById('pexels-result').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }

            // Probar Wikipedia
            try {
                const response = await fetch(`/api/wikipedia?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                const fotos = data.fotos || [];
                renderFotos('wikipedia-result', fotos, 'Wikipedia');
            } catch (error) {
                document.getElementById('wikipedia-result').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }

            // Resumen final
            const resultados = {
                unsplash: document.querySelector('#unsplash-result img') ? '✅ Tiene fotos' : '❌ Sin fotos',
                pexels: document.querySelector('#pexels-result img') ? '✅ Tiene fotos' : '❌ Sin fotos',
                wikipedia: document.querySelector('#wikipedia-result img') ? '✅ Tiene fotos' : '❌ Sin fotos'
            };

            document.getElementById('resultado-final').innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                    <div>Unsplash: ${resultados.unsplash}</div>
                    <div>Pexels: ${resultados.pexels}</div>
                    <div>Wikipedia: ${resultados.wikipedia}</div>
                </div>
                <div style="margin-top: 10px; color: #4a90d0;">
                    💡 ${Object.values(resultados).filter(r => r.includes('✅')).length} de 3 APIs tienen fotos para "${query}"
                </div>
            `;
        }

        function renderFotos(containerId, fotos, apiName) {
            const container = document.getElementById(containerId);
            
            if (!fotos || fotos.length === 0) {
                container.innerHTML = `<div class="error">📷 No se encontraron fotos en ${apiName}</div>`;
                return;
            }

            let html = '<div class="fotos-grid">';
            fotos.slice(0, 3).forEach(foto => {
                const url = foto.urls?.small || foto.url || foto.urls?.medium || foto.src?.small;
                const autor = foto.photographer?.name || foto.user?.name || foto.photographer || 'Autor desconocido';
                html += `
                    <div>
                        <img src="${url}" alt="${foto.alt || query}" onerror="this.style.display='none'">
                        <div style="font-size: 10px; color: #666; margin-top: 4px;">📸 ${autor}</div>
                    </div>
                `;
            });
            html += '</div>';
            html += `<div style="color: #4a90d0; font-size: 12px; margin-top: 10px;">✅ ${fotos.length} fotos encontradas</div>`;
            
            container.innerHTML = html;
        }

        // Probar al cargar la página
        window.onload = probarTodas;
    </script>
</body>
</html>
