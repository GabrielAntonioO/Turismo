<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Fotos - Wikipedia</title>
    <style>
        body { 
            background: #0d0d0d; 
            color: white; 
            font-family: Arial, sans-serif; 
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .fotos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .fotos-grid img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .loading { color: #888; text-align: center; padding: 20px; }
        .error { color: #ff6b6b; text-align: center; padding: 20px; }
        .success { color: #6bff6b; text-align: center; padding: 20px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        .input-group button {
            padding: 12px 24px;
            background: #4a90d0;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:hover { background: #5aa0e0; }
        .log {
            background: #0d0d0d;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #888;
            max-height: 200px;
            overflow: auto;
            margin-top: 10px;
        }
        .log .ok { color: #6bff6b; }
        .log .error { color: #ff6b6b; }
        .log .info { color: #4a90d0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Prueba de Fotos - Wikipedia</h1>
        <p style="color: #888;">Wikipedia NO necesita API key, así que debería funcionar siempre</p>
        
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Ej: Sagrada Familia" value="Madrid">
            <button onclick="probarWikipedia()">🔍 Buscar</button>
        </div>

        <div id="resultado" class="card">
            <h2>⏳ Esperando búsqueda...</h2>
            <div class="loading">Escribe un lugar y haz clic en Buscar</div>
        </div>

        <div id="log" class="log">
            <div class="info">📋 Log de la prueba</div>
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            log.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function probarWikipedia() {
            const query = document.getElementById('searchInput').value;
            const resultado = document.getElementById('resultado');
            
            addLog(`🔍 Buscando: "${query}"`, 'info');
            
            resultado.innerHTML = `
                <h2>⏳ Buscando...</h2>
                <div class="loading">Buscando fotos para "${query}" en Wikipedia</div>
            `;

            try {
                addLog(`📡 Llamando a /api/wikipedia?query=${encodeURIComponent(query)}`, 'info');
                
                const response = await fetch(`/api/wikipedia?query=${encodeURIComponent(query)}`);
                addLog(`📊 Respuesta: ${response.status} ${response.statusText}`, 'info');
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                addLog(`📦 Datos recibidos: ${data.fotos?.length || 0} fotos`, 'info');
                
                if (data.fotos && data.fotos.length > 0) {
                    let html = `<h2>✅ Fotos encontradas (${data.fotos.length})</h2>`;
                    html += `<div class="fotos-grid">`;
                    
                    data.fotos.forEach(foto => {
                        html += `
                            <div>
                                <img src="${foto.url}" alt="${foto.title}" onerror="this.style.display='none'">
                                <div style="font-size: 10px; color: #666; margin-top: 4px;">📸 ${foto.title}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div>`;
                    resultado.innerHTML = html;
                    addLog(`✅ Éxito: ${data.fotos.length} fotos encontradas`, 'ok');
                } else {
                    resultado.innerHTML = `
                        <h2>❌ No se encontraron fotos</h2>
                        <div class="error">No hay fotos disponibles para "${query}" en Wikipedia</div>
                        <div style="margin-top: 10px; color: #888;">
                            💡 Sugerencias:<br>
                            - Prueba con nombres más específicos: "Sagrada Familia Barcelona"<br>
                            - Prueba con ciudades: "Madrid", "Barcelona", "Sevilla"<br>
                            - Prueba con monumentos: "Alhambra", "Catedral", "Puerta del Sol"
                        </div>
                    `;
                    addLog(`❌ No se encontraron fotos para "${query}"`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error: ${error.message}`, 'error');
                resultado.innerHTML = `
                    <h2>❌ Error</h2>
                    <div class="error">Error: ${error.message}</div>
                    <div style="margin-top: 10px; color: #888;">
                        💡 Posibles causas:<br>
                        1. El archivo api/wikipedia.js no existe<br>
                        2. Error en el código de Wikipedia<br>
                        3. Problema de conexión a Wikipedia
                    </div>
                `;
            }
        }

        // Probar al cargar
        window.onload = probarWikipedia;
    </script>
</body>
</html>
