<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Fotos</title>
    <style>
        body { 
            background: #0d0d0d; 
            color: white; 
            font-family: Arial, sans-serif; 
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .api-card {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
        }
        .api-card h2 {
            color: #4a90d0;
            margin-top: 0;
        }
        .fotos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .fotos-grid img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .loading {
            color: #888;
            text-align: center;
            padding: 20px;
        }
        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
        }
        .success {
            color: #6bff6b;
            text-align: center;
            padding: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        .input-group button {
            padding: 12px 24px;
            background: #4a90d0;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:hover {
            background: #5aa0e0;
        }
        .resultado-final {
            background: #1a1a2e;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-success { background: #2d6b2d; color: #6bff6b; }
        .badge-error { background: #6b2d2d; color: #ff6b6b; }
        .badge-warning { background: #6b5a2d; color: #ffd76b; }
    </style>
</head>
<body>
    <h1>🔍 Prueba de APIs de Fotos</h1>
    
    <div class="input-group">
        <input type="text" id="searchInput" placeholder="Ej: Sagrada Familia Barcelona" value="Sagrada Familia Barcelona">
        <button onclick="probarTodas()">🔍 Probar todas</button>
    </div>

    <div class="container" id="resultados">
        <!-- Los resultados se mostrarán aquí -->
    </div>

    <script>
        async function probarTodas() {
            const query = document.getElementById('searchInput').value;
            const container = document.getElementById('resultados');
            
            container.innerHTML = `
                <div class="api-card">
                    <h2>⏳ Probando...</h2>
                    <div class="loading">Buscando fotos para "${query}"</div>
                </div>
            `;

            // Probar usando el endpoint combinado
            try {
                const response = await fetch(`/api/buscar-fotos?query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                if (data.fotos && data.fotos.length > 0) {
                    let html = `<div class="api-card">
                        <h2>✅ Fotos encontradas en: ${data.fuente}</h2>
                        <div style="color: #aaa; margin-bottom: 10px;">${data.total} fotos encontradas</div>
                        <div class="fotos-grid">`;
                    
                    data.fotos.forEach(foto => {
                        const url = foto.urls?.small || foto.url || foto.urls?.medium || foto.src?.small;
                        const autor = foto.photographer?.name || foto.user?.name || foto.photographer || 'Autor desconocido';
                        html += `
                            <div>
                                <img src="${url}" alt="${foto.alt || query}" onerror="this.style.display='none'">
                                <div style="font-size: 10px; color: #666; margin-top: 4px;">📸 ${autor}</div>
                            </div>
                        `;
                    });
                    
                    html += `</div></div>`;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `
                        <div class="api-card">
                            <h2>❌ No se encontraron fotos</h2>
                            <div class="error">No hay fotos disponibles para "${query}" en ninguna API</div>
                            <div style="margin-top: 10px; color: #888; font-size: 14px;">
                                💡 Sugerencias:<br>
                                - Prueba con un nombre más específico<br>
                                - Prueba con "Madrid" en lugar de "Ciudad de Madrid"<br>
                                - Asegúrate de que las API keys están configuradas en Vercel
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="api-card">
                        <h2>❌ Error</h2>
                        <div class="error">Error al buscar fotos: ${error.message}</div>
                        <div style="margin-top: 10px; color: #888; font-size: 14px;">
                            💡 Verifica que:<br>
                            1. Los archivos api/unsplash.js, api/pexels.js y api/wikipedia.js existen<br>
                            2. Las API keys están configuradas en Vercel<br>
                            3. Has hecho deploy de los cambios
                        </div>
                    </div>
                `;
            }
        }

        // Probar al cargar la página
        window.onload = probarTodas;
    </script>
</body>
</html>
