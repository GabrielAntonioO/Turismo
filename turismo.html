<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Turismo · Cerca de ti</title>
  <style>
    :root {
      --bg:       #000000;
      --bg2:      #0d0d0d;
      --border:   #1e1e2a;
      --accent:   #4a70a0;
      --font:     'SF Mono', 'Fira Code', 'Menlo', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #ffffff;
      font-family: var(--font);
      font-size: 16px;
      min-height: 100dvh;
      padding: 20px 16px 40px;
    }

    h1 {
      font-size: 13px;
      color: #555566;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    #ubicacion {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 24px;
      min-height: 24px;
    }

    #estado {
      color: #555566;
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #1e1e2a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .lugar {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .lugar-num {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .lugar-nombre {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .lugar-desc {
      font-size: 13px;
      color: #888899;
      line-height: 1.5;
      margin-bottom: 12px;
      font-family: -apple-system, sans-serif;
    }

    .lugar-dist {
      font-size: 12px;
      color: #555566;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .maps-btn {
      display: inline-block;
      padding: 8px 14px;
      background: #0a1a2a;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: #4a90d0;
      font-family: var(--font);
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .error-box {
      padding: 14px;
      background: #2a0a0a;
      border: 1px solid #5a1a1a;
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 13px;
      line-height: 1.5;
    }

    .btn-retry {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 16px;
      background: #3a1010;
      border: 1px solid #7a2020;
      border-radius: 4px;
      color: #ff9999;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
    }
  </style>
</head>
<body>

<h1>📍 Lugares de interés</h1>
<div id="ubicacion"></div>
<div id="estado"><span class="spinner"></span> Obteniendo ubicación…</div>
<div id="lista"></div>

<script>
  const JSONBIN_API_KEY = '$2a$10$AjMK/XksYd.Fw0phfT.B4ud0nuC1nyjt0ZBo52sJk/wnCU75zuC76';
  const JSONBIN_BIN_ID  = '6a0ffb2bee5a733b12fde0eb';

  function setEstado(msg, spinner = false) {
    document.getElementById('estado').innerHTML =
      (spinner ? '<span class="spinner"></span> ' : '') + msg;
  }

  function setError(msg) {
    document.getElementById('lista').innerHTML =
      `<div class="error-box">⚠️ ${msg}<br>
        <span class="btn-retry" onclick="init()">↻ Reintentar</span>
      </div>`;
    setEstado('');
  }

  async function getLocationFromGPS() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, ciudad: null, barrio: null }),
        ()    => resolve(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    });
  }

  async function getLocationFromJsonBin() {
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      if (!r.ok) throw new Error();
      const d = await r.json();
      const rec = d.record;
      if (rec?.lat && rec?.lon) return rec;
    } catch {}
    return null;
  }

  async function getLocation() {
    setEstado('Obteniendo ubicación GPS…', true);
    const gps = await getLocationFromGPS();
    if (gps) return gps;
    setEstado('Usando última ubicación guardada…', true);
    return await getLocationFromJsonBin();
  }

  async function getLugares(lat, lon, lugar) {
    const r = await fetch(`/api/turismo?lat=${lat}&lon=${lon}&lugar=${encodeURIComponent(lugar)}`);
    if (!r.ok) throw new Error(`Error ${r.status}`);
    return await r.json();
  }

  function renderLugares(lugares, lat, lon) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    lugares.forEach((l, i) => {
      const destino = encodeURIComponent(l.nombre + (l.ciudad ? ', ' + l.ciudad : ''));
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${destino}`;
      const div = document.createElement('div');
      div.className = 'lugar';
      div.style.animationDelay = `${i * 0.08}s`;
      div.innerHTML = `
        <div class="lugar-num">${String(i+1).padStart(2,'0')}</div>
        <div class="lugar-nombre">${l.nombre}</div>
        <div class="lugar-desc">${l.descripcion}</div>
        <div class="lugar-dist">~ ${l.distancia_km} km</div>
        <a class="maps-btn" href="${mapsUrl}" target="_blank">→ Cómo llegar</a>
      `;
      lista.appendChild(div);
    });
  }

  async function init() {
    document.getElementById('lista').innerHTML = '';
    setEstado('Obteniendo ubicación…', true);

    const loc = await getLocation();
    if (!loc) { setError('No se pudo obtener la ubicación. Abre primero la página GPS.'); return; }

    setEstado('Consultando lugares de interés…', true);

    try {
      const lugares = await getLugares(loc.lat, loc.lon, loc.ciudad || 'tu ubicación');
      // Display city from first place
      if (lugares.length > 0 && lugares[0].ciudad) {
        document.getElementById('ubicacion').textContent = '📍 ' + lugares[0].ciudad.toUpperCase();
      } else if (loc.ciudad) {
        document.getElementById('ubicacion').textContent = '📍 ' + loc.ciudad.toUpperCase();
      } else {
        document.getElementById('ubicacion').textContent = '📍 UBICACIÓN DESCONOCIDA';
      }
      setEstado('');
      renderLugares(lugares, loc.lat, loc.lon);
    } catch (e) {
      setError('Error consultando la IA. Inténtalo de nuevo.');
      console.error(e);
    }
  }

  init();
</script>
</body>
</html>
