<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Turismo</title>
  <style>
    :root {
      --bg:       #000000;
      --bg2:      #0d0d0d;
      --border:   #1e1e2a;
      --accent:   #4a70a0;
      --font:     'SF Mono', 'Fira Code', 'Menlo', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #ffffff;
      font-family: var(--font);
      font-size: 16px;
      min-height: 100dvh;
      padding: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }

    #ubicacion {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #pantalla-inicio {
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #pantalla-resultados {
      display: none;
      padding: 20px 16px 80px;
    }

    #estado-inicio {
      display: none;
    }

    .btn-categoria {
      padding: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ffffff;
      font-family: var(--font);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-categoria:active {
      background: var(--accent);
      color: #000000;
    }

    .lugar {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .lugar-num {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .lugar-nombre {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .lugar-desc {
      font-size: 13px;
      color: #888899;
      line-height: 1.5;
      margin-bottom: 12px;
      font-family: -apple-system, sans-serif;
    }

    .lugar-dist {
      font-size: 12px;
      color: #555566;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .maps-btn {
      display: inline-block;
      padding: 8px 14px;
      background: #0a1a2a;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: #4a90d0;
      font-family: var(--font);
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .btn-volver {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      padding: 14px;
      background: #0a1a2a;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #4a90d0;
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
    }

    .btn-volver:active {
      background: var(--accent);
      color: #000000;
    }

    #estado {
      color: #555566;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #1e1e2a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      padding: 14px;
      background: #2a0a0a;
      border: 1px solid #5a1a1a;
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 13px;
      line-height: 1.5;
    }

    .btn-retry {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 16px;
      background: #3a1010;
      border: 1px solid #7a2020;
      border-radius: 4px;
      color: #ff9999;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <div id="ubicacion">📍 OBTENIENDO UBICACIÓN…</div>
</header>

<div id="pantalla-inicio">
  <div id="estado-inicio" style="color:#555566; font-size:13px; letter-spacing:0.08em; text-align:center; padding:20px; display:flex; align-items:center; justify-content:center; gap:8px;"><span class="spinner"></span> OBTENIENDO UBICACIÓN…</div>
  <button class="btn-categoria" onclick="cargarLugares('interes')">📍 Puntos de interés</button>
  <button class="btn-categoria" onclick="cargarLugares('comer')">🍽️ Para comer</button>
  <button class="btn-categoria" onclick="cargarLugares('gasolineras')">⛽ Gasolineras</button>
</div>

<div id="pantalla-resultados">
  <div id="estado"></div>
  <div id="lista"></div>
</div>

<button class="btn-volver" id="btn-volver" onclick="volverAlInicio()" style="display:none;">← VOLVER</button>

<script>
  const JSONBIN_API_KEY = '$2a$10$AjMK/XksYd.Fw0phfT.B4ud0nuC1nyjt0ZBo52sJk/wnCU75zuC76';
  const JSONBIN_BIN_ID  = '6a0ffb2bee5a733b12fde0eb';

  let ubicacionActual = null;

  function setEstado(msg, spinner = false) {
    document.getElementById('estado').innerHTML =
      (spinner ? '<span class="spinner"></span> ' : '') + msg;
  }

  function setError(msg) {
    document.getElementById('lista').innerHTML =
      `<div class="error-box">⚠️ ${msg}<br>
        <span class="btn-retry" onclick="location.reload()">↻ Reintentar</span>
      </div>`;
    setEstado('');
  }

  async function getLocationFromGPS() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, ciudad: null }),
        ()    => resolve(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    });
  }

  async function getLocationFromJsonBin() {
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      if (!r.ok) throw new Error();
      const d = await r.json();
      const rec = d.record;
      if (rec?.lat && rec?.lon) return rec;
    } catch {}
    return null;
  }

  async function getReverseGeocode(lat, lon) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`);
      if (!r.ok) throw new Error();
      const data = await r.json();
      const a = data.address;
      return a.city || a.town || a.county || a.municipality || 'Ubicación desconocida';
    } catch {
      return 'Ubicación desconocida';
    }
  }

  async function getLocation() {
    const gps = await getLocationFromGPS();
    if (gps) return gps;
    return await getLocationFromJsonBin();
  }

  async function updateUbicacion(lat, lon) {
    const ciudad = await getReverseGeocode(lat, lon);
    ubicacionActual.ciudad = ciudad;
    document.querySelector('header #ubicacion').textContent = '📍 ' + ciudad.toUpperCase();
  }

  async function cargarLugares(tipo) {
    if (!ubicacionActual) {
      setError('No se pudo obtener la ubicación.');
      return;
    }

    document.getElementById('pantalla-inicio').style.display = 'none';
    document.getElementById('pantalla-resultados').style.display = 'block';
    document.getElementById('btn-volver').style.display = 'block';

    setEstado('Cargando…', true);
    document.getElementById('lista').innerHTML = '';

    try {
      const r = await fetch(`/api/turismo?type=${tipo}&lat=${ubicacionActual.lat}&lon=${ubicacionActual.lon}`);
      if (!r.ok) throw new Error(`Error ${r.status}`);
      const lugares = await r.json();

      if (!Array.isArray(lugares) || lugares.length === 0) {
        setError('No se encontraron resultados.');
        return;
      }

      setEstado('');
      renderLugares(lugares);
    } catch (e) {
      setError('Error consultando. Inténtalo de nuevo.');
      console.error(e);
    }
  }

  function renderLugares(lugares) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    lugares.forEach((l, i) => {
      const destino = encodeURIComponent(l.nombre + (l.ciudad ? ', ' + l.ciudad : ''));
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${destino}`;
      const div = document.createElement('div');
      div.className = 'lugar';
      div.style.animationDelay = `${i * 0.08}s`;
      div.innerHTML = `
        <div class="lugar-num">${String(i+1).padStart(2,'0')}</div>
        <div class="lugar-nombre">${l.nombre}${l.ciudad ? ' (' + l.ciudad + ')' : ''}</div>
        <div class="lugar-desc">${l.descripcion}</div>
        <div class="lugar-dist">~ ${l.distancia_km} km</div>
        <a class="maps-btn" href="${mapsUrl}" target="_blank">→ Cómo llegar</a>
      `;
      lista.appendChild(div);
    });
  }

  function volverAlInicio() {
    document.getElementById('pantalla-inicio').style.display = 'flex';
    document.getElementById('pantalla-resultados').style.display = 'none';
    document.getElementById('btn-volver').style.display = 'none';
  }

  async function init() {
    setEstado('Obteniendo ubicación…', true);
    ubicacionActual = await getLocation();
    if (!ubicacionActual) {
      setError('No se pudo obtener la ubicación. Abre primero la página GPS.');
      return;
    }
    await updateUbicacion(ubicacionActual.lat, ubicacionActual.lon);
    document.getElementById('estado-inicio').style.display = 'none';
  }

  init();
</script>
</body>
</html>
