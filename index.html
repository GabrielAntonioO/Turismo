<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Turismo</title>
  <style>
    :root {
      --bg:       #000000;
      --bg2:      #0d0d0d;
      --border:   #1e1e2a;
      --accent:   #4a70a0;
      --font:     'SF Mono', 'Fira Code', 'Menlo', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #ffffff;
      font-family: var(--font);
      font-size: 16px;
      min-height: 100dvh;
      padding: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }

    #ubicacion {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    #pantalla-inicio {
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #pantalla-resultados {
      display: none;
      padding: 20px 16px 80px;
    }

    #estado-inicio {
      display: none;
    }

    .btn-categoria {
      padding: 24px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #ffffff;
      font-family: var(--font);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-categoria:active {
      background: var(--accent);
      color: #000000;
    }

    .lugar {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      animation: fadeIn 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .lugar-num {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .lugar-nombre {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }

    .lugar-desc {
      font-size: 13px;
      color: #888899;
      line-height: 1.5;
      margin-bottom: 12px;
      font-family: -apple-system, sans-serif;
    }

    .lugar-dist {
      font-size: 12px;
      color: #555566;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .maps-btn {
      display: inline-block;
      padding: 8px 14px;
      background: #0a1a2a;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: #4a90d0;
      font-family: var(--font);
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .btn-volver {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      padding: 14px;
      background: #0a1a2a;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #4a90d0;
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
    }

    .btn-volver:active {
      background: var(--accent);
      color: #000000;
    }

    #estado {
      color: #555566;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #1e1e2a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      padding: 14px;
      background: #2a0a0a;
      border: 1px solid #5a1a1a;
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 13px;
      line-height: 1.5;
    }

    .btn-retry {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 16px;
      background: #3a1010;
      border: 1px solid #7a2020;
      border-radius: 4px;
      color: #ff9999;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
    }

    /* ========== ESTILOS PARA LAS FOTOS ========== */

    .fotos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 16px 0;
    }

    .foto-item {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1/1;
      background: var(--bg2);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .foto-item:hover {
      transform: scale(1.02);
    }

    .foto-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .foto-item img:hover {
      transform: scale(1.05);
    }

    .foto-credits {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.75);
      color: #aaa;
      font-size: 8px;
      letter-spacing: 0.05em;
      text-align: right;
      font-family: -apple-system, sans-serif;
    }

    .foto-placeholder {
      grid-column: 1 / -1;
      padding: 20px;
      text-align: center;
      color: #555566;
      font-size: 13px;
      background: var(--bg2);
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .foto-skeleton {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--bg2) 25%, var(--border) 50%, var(--bg2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .modal-foto {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-foto.active {
      display: flex;
    }

    .modal-foto img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }

    .modal-foto .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .modal-foto .close:hover {
      color: #4a90d0;
      transform: scale(1.1);
    }

    @media (max-width: 600px) {
      .fotos-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      
      .modal-foto img {
        max-width: 95%;
        max-height: 80%;
      }
    }
  </style>
</head>
<body>

<header>
  <div id="ubicacion">📍 OBTENIENDO UBICACIÓN…</div>
</header>

<div id="pantalla-inicio">
  <div id="estado-inicio" style="color:#555566; font-size:13px; letter-spacing:0.08em; text-align:center; padding:20px; display:flex; align-items:center; justify-content:center; gap:8px;"><span class="spinner"></span> OBTENIENDO UBICACIÓN…</div>
  <button class="btn-categoria" onclick="cargarLugares('interes')">📍 Puntos de interés</button>
  <button class="btn-categoria" onclick="cargarLugares('comer')">🍽️ Para comer</button>
  <button class="btn-categoria" onclick="cargarLugares('gasolineras')">⛽ Gasolineras</button>
</div>

<div id="pantalla-resultados">
  <div id="estado"></div>
  <div id="lista"></div>
</div>

<button class="btn-volver" id="btn-volver" onclick="volverAlInicio()" style="display:none;">← VOLVER</button>

<div class="modal-foto" id="modalFoto" onclick="cerrarModal()">
  <span class="close">&times;</span>
  <img id="modalImg" src="" alt="Foto ampliada">
</div>

<script>
  const JSONBIN_API_KEY = '$2a$10$AjMK/XksYd.Fw0phfT.B4ud0nuC1nyjt0ZBo52sJk/wnCU75zuC76';
  const JSONBIN_BIN_ID  = '6a0ffb2bee5a733b12fde0eb';

  let ubicacionActual = null;

  function setEstado(msg, spinner = false) {
    document.getElementById('estado').innerHTML =
      (spinner ? '<span class="spinner"></span> ' : '') + msg;
  }

  function setError(msg) {
    document.getElementById('lista').innerHTML =
      `<div class="error-box">⚠️ ${msg}<br>
        <span class="btn-retry" onclick="location.reload()">↻ Reintentar</span>
      </div>`;
    setEstado('');
  }

  async function getLocationFromGPS() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, ciudad: null }),
        ()    => resolve(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    });
  }

  async function getLocationFromJsonBin() {
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      if (!r.ok) throw new Error();
      const d = await r.json();
      const rec = d.record;
      if (rec?.lat && rec?.lon) return rec;
    } catch {}
    return null;
  }

  async function getReverseGeocode(lat, lon) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`);
      if (!r.ok) throw new Error();
      const data = await r.json();
      const a = data.address;
      return a.city || a.town || a.county || a.municipality || 'Ubicación desconocida';
    } catch {
      return 'Ubicación desconocida';
    }
  }

  async function getLocation() {
    const gps = await getLocationFromGPS();
    if (gps) return gps;
    return await getLocationFromJsonBin();
  }

  async function updateUbicacion(lat, lon) {
    const ciudad = await getReverseGeocode(lat, lon);
    ubicacionActual.ciudad = ciudad;
    document.querySelector('header #ubicacion').textContent = '📍 ' + ciudad.toUpperCase();
  }

  async function cargarLugares(tipo) {
    if (!ubicacionActual) {
      setError('No se pudo obtener la ubicación.');
      return;
    }

    document.getElementById('pantalla-inicio').style.display = 'none';
    document.getElementById('pantalla-resultados').style.display = 'block';
    document.getElementById('btn-volver').style.display = 'block';

    setEstado('Cargando…', true);
    document.getElementById('lista').innerHTML = '';

    try {
      const r = await fetch(`/api/turismo?type=${tipo}&lat=${ubicacionActual.lat}&lon=${ubicacionActual.lon}`);
      if (!r.ok) throw new Error(`Error ${r.status}`);
      const lugares = await r.json();

      if (!Array.isArray(lugares) || lugares.length === 0) {
        setError('No se encontraron resultados.');
        return;
      }

      setEstado('');
      renderLugares(lugares);
    } catch (e) {
      setError('Error consultando. Inténtalo de nuevo.');
      console.error(e);
    }
  }

  // ========== FUNCIONES PARA LAS FOTOS ==========

  function renderLugares(lugares) {
    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    
    lugares.forEach((l, i) => {
      const destino = encodeURIComponent(l.nombre + (l.ciudad ? ', ' + l.ciudad : ''));
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${destino}`;
      
      const div = document.createElement('div');
      div.className = 'lugar';
      div.style.animationDelay = `${i * 0.08}s`;
      
      const fotosId = `fotos-${i}-${Date.now()}`;
      
      div.innerHTML = `
        <div class="lugar-num">${String(i+1).padStart(2,'0')}</div>
        <div class="lugar-nombre">${l.nombre}${l.ciudad ? ' (' + l.ciudad + ')' : ''}</div>
        <div class="fotos-container" id="${fotosId}">
          <div class="foto-skeleton"></div>
          <div class="foto-skeleton"></div>
          <div class="foto-skeleton"></div>
        </div>
        <div class="lugar-desc">${l.descripcion}</div>
        <div class="lugar-dist">~ ${l.distancia_km} km</div>
        <a class="maps-btn" href="${mapsUrl}" target="_blank">→ Cómo llegar</a>
      `;
      
      lista.appendChild(div);
      
      cargarFotos(l.nombre, fotosId);
    });
  }

  async function cargarFotos(query, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    try {
      const response = await fetch(`/api/buscar-fotos?query=${encodeURIComponent(query)}`);
      
      if (!response.ok) {
        throw new Error(`Error ${response.status}`);
      }
      
      const data = await response.json();
      const fotos = data.fotos || [];
      
      if (fotos.length === 0) {
        container.innerHTML = `<div class="foto-placeholder">📷 Sin imágenes disponibles</div>`;
        return;
      }
      
      container.innerHTML = fotos.slice(0, 3).map(foto => `
        <div class="foto-item" onclick="abrirModal('${foto.url}', '${foto.title || query}')">
          <img src="${foto.url}" 
               alt="${foto.title || query}" 
               loading="lazy"
               onerror="this.parentElement.innerHTML='<div class=foto-placeholder>❌ Error</div>'">
          <div class="foto-credits">📸 ${data.fuente || 'Wikipedia'}</div>
        </div>
      `).join('');
      
    } catch (error) {
      console.error('Error cargando fotos:', error);
      container.innerHTML = `<div class="foto-placeholder">❌ Error al cargar imágenes</div>`;
    }
  }

  // ========== FUNCIONES PARA EL MODAL ==========

  function abrirModal(url, autor) {
    const modal = document.getElementById('modalFoto');
    const img = document.getElementById('modalImg');
    img.src = url;
    img.alt = `Foto de ${autor}`;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function cerrarModal() {
    const modal = document.getElementById('modalFoto');
    modal.classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      cerrarModal();
    }
  });

  // ========== FUNCIONES DE NAVEGACIÓN ==========

  function volverAlInicio() {
    document.getElementById('pantalla-inicio').style.display = 'flex';
    document.getElementById('pantalla-resultados').style.display = 'none';
    document.getElementById('btn-volver').style.display = 'none';
  }

  async function init() {
    setEstado('Obteniendo ubicación…', true);
    ubicacionActual = await getLocation();
    if (!ubicacionActual) {
      setError('No se pudo obtener la ubicación. Abre primero la página GPS.');
      return;
    }
    await updateUbicacion(ubicacionActual.lat, ubicacionActual.lon);
    document.getElementById('estado-inicio').style.display = 'none';
  }

  init();
</script>
</body>
</html>
